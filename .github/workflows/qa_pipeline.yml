name: 3rd Pass Validation (HOT TM)

on:
  workflow_dispatch:
    inputs:
      project_id:
        description: 'HOT TM Project ID'
        required: true
        type: string
      geofabrik_url:
        description: 'Direct Geofabrik PBF URL'
        required: true
        type: string
  repository_dispatch:
    types: [project_100_validated] # The Webhook trigger for developers

jobs:
  qa_audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Fetch Project GeoJSONs
        run: |
          PROJ_ID="${{ github.event.inputs.project_id || github.event.client_payload.project_id }}"
          curl -s "https://tasking-manager-api.hotosm.org/api/v2/projects/$PROJ_ID/queries/aoi/" -o project_aoi.geojson
          curl -s "https://tasking-manager-api.hotosm.org/api/v2/projects/$PROJ_ID/tasks/" -o project_tasks.geojson

      - name: Download Geofabrik PBF
        run: |
          PBF_URL="${{ github.event.inputs.geofabrik_url || github.event.client_payload.geofabrik_url }}"
          wget -q "$PBF_URL" -O region.osm.pbf

      - name: Build and Run QA Container
        run: |
          docker build -t qabot .
          docker run --rm -v ${{ github.workspace }}:/data qabot region.osm.pbf project_aoi.geojson project_tasks.geojson

      - name: Generate Executive Summary
        run: |
          echo "## 3rd Pass Validation Results 🚀" >> $GITHUB_STEP_SUMMARY
          echo "**Project ID:** ${{ github.event.inputs.project_id || github.event.client_payload.project_id }}" >> $GITHUB_STEP_SUMMARY
          echo "Validation completed successfully. Download the zip artifact to view the GeoJSON in JOSM." >> $GITHUB_STEP_SUMMARY

      - name: Upload Zip Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: QA_Results_Project_${{ github.event.inputs.project_id || github.event.client_payload.project_id }}
          path: |
            qa_errors.geojson
            task_grid_qa_summary.geojson
